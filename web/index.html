<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Agent 准入检查器</title><style>body{font-family:system-ui,-apple-system,"Microsoft YaHei",sans-serif;max-width:960px;margin:40px auto;padding:0 20px;color:#182b42;background:#f5f7fa}main{background:#fff;border:1px solid #dce4ee;border-radius:14px;padding:28px}textarea,input,select,button{font:inherit;padding:10px;border-radius:8px;border:1px solid #b9c8d9}textarea{width:100%;min-height:100px;box-sizing:border-box}button{cursor:pointer;background:#2359c4;color:#fff;border-color:#2359c4;margin:8px 4px 8px 0}.muted{color:#60738a}.status{padding:4px 9px;border-radius:20px;background:#edf1f7;display:inline-block}.event{border-left:3px solid #2359c4;padding:7px 12px;margin:7px 0;background:#f5f8ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}@media(max-width:700px){.grid{grid-template-columns:1fr}}pre{white-space:pre-wrap;overflow:auto;background:#13263c;color:#dce8f8;padding:14px;border-radius:8px}</style></head><body><main><h1>Agent 工具与依赖准入检查器</h1><p class="muted">P0：Ethereum 主网原生 ETH、finalized 快照、服务准入、结果验收和证据报告。</p><p><a href="/prototype.html">打开离线交互原型（SAMPLE）</a></p><label for="intent">研究任务</label><textarea id="intent">请核对 0x2222222222222222222222222222222222222222 的 ETH 余额，使用执行时 finalized 区块。</textarea><br><label><input id="fallback" type="checkbox" checked> 允许在同一范围内切换一次备用服务</label><br><label>演示场景 <select id="scenario"><option value="normal">正常通过</option><option value="stale_primary">首选旧区块并切换</option><option value="both_fail">两个服务均失败</option><option value="reference_conflict">参考来源冲突</option><option value="manifest_changed">首选清单变化</option></select></label><br><button id="create">生成任务范围</button><button id="approve" disabled>批准并运行</button><button id="stop" disabled>独立停止</button><span id="status" class="status">尚未创建</span><div class="grid"><section><h2>运行事件</h2><div id="events" class="muted">尚未创建任务。</div></section><section><h2>终态证据</h2><button id="evidence" disabled>读取证据报告</button><pre id="report">终态后可读取；报告会明确 SAMPLE/LIVE 和未覆盖项。</pre></section></div></main><script>let task=null;const $=id=>document.getElementById(id);const show=(v)=>{$('status').textContent=v.status||v;$('approve').disabled=!task||v.status!=='AWAITING_APPROVAL';$('stop').disabled=!task||!['QUEUED','RUNNING'].includes(v.status);$('evidence').disabled=!task||!['SUCCEEDED','FAILED','QUARANTINED','CANCELLED'].includes(v.status)};async function api(path,opts={}){const r=await fetch(path,{headers:{'content-type':'application/json','x-owner':'dev-owner'},...opts});const b=await r.json();if(!r.ok)throw new Error(b.error||r.status);return b}function render(t){task=t;show(t);$('events').innerHTML=(t.events||[]).map(e=>'<div class="event"><b>'+e.type+'</b> '+e.message+'</div>').join('')||'尚未有事件';$('report').textContent=t.report?JSON.stringify(t.report,null,2):'终态后可读取；报告会明确 SAMPLE/LIVE 和未覆盖项。'}$('create').onclick=async()=>{try{render(await api('/v1/tasks',{method:'POST',body:JSON.stringify({text:$('intent').value,allowFallback:$('fallback').checked,scenario:$('scenario').value})}))}catch(e){alert(e.message)}};$('approve').onclick=async()=>{try{render(await api('/v1/tasks/'+task.taskId+'/approve',{method:'POST',body:'{}'}));poll()}catch(e){alert(e.message)}};$('stop').onclick=async()=>{try{render(await api('/v1/tasks/'+task.taskId+'/stop',{method:'POST',body:'{}'}));poll()}catch(e){alert(e.message)}};$('evidence').onclick=async()=>{try{$('report').textContent=JSON.stringify(await api('/v1/tasks/'+task.taskId+'/evidence'),null,2)}catch(e){alert(e.message)}};async function poll(){if(!task)return;for(let i=0;i<40;i++){await new Promise(r=>setTimeout(r,250));try{const t=await api('/v1/tasks/'+task.taskId);render(t);if(['SUCCEEDED','FAILED','QUARANTINED','CANCELLED'].includes(t.status))return}catch(e){return}}}</script></body></html>
