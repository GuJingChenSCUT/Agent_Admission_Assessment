openapi: 3.1.0
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
info:
  title: Agent Admission P0 API
  version: 0.2.0-design
  description: Design contract, no deployed endpoint. owner is derived from auth.
    Cookie deployments additionally require CSRF. P0 rejects FIXED_BLOCK.
servers:
- url: https://api.example.invalid
  description: Placeholder only; replace with actual deployment
paths:
  /v1/tasks:
    post:
      operationId: createTask
      summary: Create a bounded task proposal; never auto-execute
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Create a bounded task proposal; never auto-execute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: Invalid input or unsupported P0 scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision, hash, state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Configuration or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
  /v1/tasks/{taskId}:
    get:
      operationId: getTask
      summary: Get owner-scoped task state and accepted fact
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Get owner-scoped task state and accepted fact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - in: path
      name: taskId
      required: true
      schema: &id001
        type: string
        pattern: ^[a-z][a-z0-9_:-]{2,127}$
  /v1/tasks/{taskId}/clarifications:
    post:
      operationId: clarifyTask
      summary: Update draft; invalidate previous approval nonce
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Update draft; invalidate previous approval nonce
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: Invalid input or unsupported P0 scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision, hash, state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Configuration or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClarificationRequest'
    parameters:
    - in: path
      name: taskId
      required: true
      schema: *id001
  /v1/tasks/{taskId}/approve:
    post:
      operationId: approveTask
      summary: Atomically approve this exact revision and create run outbox
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Atomically approve this exact revision and create run outbox
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskView'
        '400':
          description: Invalid input or unsupported P0 scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision, hash, state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Configuration or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApprovalRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Scoped to authenticated owner + route. Same key, changed body
          = 409.
    parameters:
    - in: path
      name: taskId
      required: true
      schema: *id001
  /v1/tasks/{taskId}/stop:
    post:
      operationId: stopTask
      summary: Priority stop; independent of model and invocation queue
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Priority stop; independent of model and invocation queue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StopResponse'
        '400':
          description: Invalid input or unsupported P0 scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StopRequest'
    parameters:
    - in: path
      name: taskId
      required: true
      schema: *id001
  /v1/tasks/{taskId}/events:
    get:
      operationId: getTaskEvents
      summary: Resume monotonic owner-scoped event log
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Resume monotonic owner-scoped event log
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResponse'
        '400':
          description: Invalid input or unsupported P0 scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      parameters:
      - in: query
        name: after
        schema:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        description: Return events with sequence > after. Default 0.
      - in: query
        name: limit
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
    parameters:
    - in: path
      name: taskId
      required: true
      schema: *id001
  /v1/tasks/{taskId}/evidence:
    get:
      operationId: getPrivateEvidence
      summary: Read owner-scoped final evidence
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Read owner-scoped final evidence
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateEvidence'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision, hash, state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - in: path
      name: taskId
      required: true
      schema: *id001
  /v1/tasks/{taskId}/artifacts/{artifactId}:
    get:
      operationId: getPrivateArtifact
      summary: Read size-bounded original bytes for owner; never execute returned
        content
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Read size-bounded original bytes for owner; never execute returned
            content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivateArtifact'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - in: path
      name: taskId
      required: true
      schema: *id001
    - in: path
      name: artifactId
      required: true
      schema: *id001
  /v1/evidence/{reportId}/public-preview:
    get:
      operationId: previewPublication
      summary: Preview immutable public fields and exact reportHash
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Preview immutable public fields and exact reportHash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicPreview'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision, hash, state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - in: path
      name: reportId
      required: true
      schema: *id001
  /v1/evidence/{reportId}/publications:
    post:
      operationId: publishEvidence
      summary: Create independent publication outbox for approved reportHash
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Create independent publication outbox for approved reportHash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '400':
          description: Invalid input or unsupported P0 scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Revision, hash, state or idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Configuration or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishRequest'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 16
          maxLength: 128
        description: Scoped to authenticated owner + route. Same key, changed body
          = 409.
    parameters:
    - in: path
      name: reportId
      required: true
      schema: *id001
  /v1/publications/{publicationId}:
    get:
      operationId: getPublication
      summary: Read owner-scoped publication state; broadcast differs from confirmed
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Read owner-scoped publication state; broadcast differs from
            confirmed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Publication'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Not found or inaccessible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    parameters:
    - in: path
      name: publicationId
      required: true
      schema: *id001
  /v1/public/evidence/verify:
    post:
      operationId: verifyPublicEvidence
      summary: Verify supplied content and configured registry; never fetch arbitrary
        report URI
      security: []
      responses:
        '200':
          description: Verify supplied content and configured registry; never fetch
            arbitrary report URI
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyResult'
        '400':
          description: Invalid input or unsupported P0 scope
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Configuration or dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyRequest'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Session credential; never an internal admission ticket
  schemas:
    Digest:
      type: string
      pattern: ^0x[0-9a-f]{64}$
    Address:
      type: string
      pattern: ^0x[0-9a-fA-F]{40}$
    Decimal:
      type: string
      pattern: ^(0|[1-9][0-9]*)$
      maxLength: 78
    TaskStatus:
      type: string
      enum:
      - NEEDS_INPUT
      - AWAITING_APPROVAL
      - QUEUED
      - RUNNING
      - STOP_REQUESTED
      - SUCCEEDED
      - FAILED
      - QUARANTINED
      - CANCELLED
    Phase:
      type: string
      enum:
      - PLAN
      - REFERENCE
      - ADMISSION
      - INVOKE
      - VERIFY
      - REPORT
      - STOPPING
      - COMPLETE
    CheckStatus:
      type: string
      enum:
      - PASS
      - FAIL
      - INCONCLUSIVE
      - ERROR
      - NOT_CHECKED
    AttemptStatus:
      type: string
      enum:
      - CHECKING
      - REJECTED
      - RUNNING
      - PASSED
      - FAILED
      - INCONCLUSIVE
      - CANCEL_REQUESTED
      - CANCELLED
      - LATE_DISCARDED
    PublicationStatus:
      type: string
      enum:
      - NOT_REQUESTED
      - QUEUED
      - SIGNED
      - BROADCAST
      - CONFIRMING
      - CONFIRMED
      - UNKNOWN
      - FAILED
      - CANCEL_REQUESTED
      - CANCELLED
    ExecutionMode:
      type: string
      enum:
      - LIVE
      - REPLAY
      - SAMPLE
      - STRUCTURED_NO_MODEL
    Limits:
      type: object
      properties:
        maxCandidateChecks:
          type: integer
          minimum: 1
          maximum: 2
        maxProviderCalls:
          type: integer
          minimum: 1
          maximum: 2
        maxFallbacks:
          type: integer
          minimum: 0
          maximum: 1
        maxModelRounds:
          type: integer
          minimum: 0
          maximum: 4
        maxOutputTokensPerRound:
          type: integer
          minimum: 1
          maximum: 2048
      required:
      - maxCandidateChecks
      - maxProviderCalls
      - maxFallbacks
      - maxModelRounds
      - maxOutputTokensPerRound
      additionalProperties: false
    SnapshotPolicy:
      type: object
      properties:
        mode:
          type: string
          enum:
          - FINALIZED_AT_RUN
          - FIXED_BLOCK
        blockNumber:
          $ref: '#/components/schemas/Decimal'
      required:
      - mode
      additionalProperties: false
      allOf:
      - if:
          properties:
            mode:
              const: FIXED_BLOCK
        then:
          required:
          - blockNumber
      - if:
          properties:
            mode:
              const: FINALIZED_AT_RUN
        then:
          not:
            required:
            - blockNumber
    TaskSpec:
      type: object
      properties:
        version:
          const: '1'
        sourceChainId:
          const: '1'
        operation:
          const: NATIVE_BALANCE
        asset:
          const: ETH
        address:
          $ref: '#/components/schemas/Address'
        snapshotPolicy:
          $ref: '#/components/schemas/SnapshotPolicy'
        candidateServiceIds:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_:-]{2,127}$
          minItems: 1
          maxItems: 2
          uniqueItems: true
        limits:
          $ref: '#/components/schemas/Limits'
      required:
      - version
      - sourceChainId
      - operation
      - asset
      - address
      - snapshotPolicy
      - candidateServiceIds
      - limits
      additionalProperties: false
    TaskDraft:
      type: object
      properties:
        intentType:
          type: string
          enum:
          - NATIVE_BALANCE
          - UNSUPPORTED
          - UNCLEAR
        address:
          anyOf:
          - $ref: '#/components/schemas/Address'
          - type: 'null'
        sourceChainId:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
        asset:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        missingFields:
          type: array
          items:
            type: string
            enum:
            - address
            - address_selection
            - scope
        clarification:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        allowFallback:
          type: boolean
      required:
      - intentType
      - address
      - sourceChainId
      - asset
      - missingFields
      - clarification
      - allowFallback
      additionalProperties: false
    ReferenceSource:
      type: object
      properties:
        sourceId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
        operatorId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
        observedBlockHash:
          $ref: '#/components/schemas/Digest'
        fetchedAt:
          type: string
          format: date-time
        balanceWei:
          $ref: '#/components/schemas/Decimal'
      required:
      - sourceId
      - operatorId
      - observedBlockHash
      - fetchedAt
      - balanceWei
      additionalProperties: false
    Snapshot:
      type: object
      properties:
        sourceChainId:
          const: '1'
        blockNumber:
          $ref: '#/components/schemas/Decimal'
        blockHash:
          $ref: '#/components/schemas/Digest'
        blockTimestamp:
          type: string
          format: date-time
        capturedAt:
          type: string
          format: date-time
        tag:
          const: finalized
        assurance:
          const: RPC_CROSS_CHECKED
        references:
          type: array
          items:
            $ref: '#/components/schemas/ReferenceSource'
          minItems: 2
          maxItems: 2
      required:
      - sourceChainId
      - blockNumber
      - blockHash
      - blockTimestamp
      - capturedAt
      - tag
      - assurance
      - references
      additionalProperties: false
    RuleCheck:
      type: object
      properties:
        checkId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
        ruleId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
        required:
          type: boolean
        status:
          $ref: '#/components/schemas/CheckStatus'
        reasonCode:
          type: string
          pattern: ^[A-Z][A-Z0-9_]{2,79}$
        expected:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        observed:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
        sourceClass:
          type: string
          enum:
          - VERIFIED_ARTIFACT
          - PROVIDER_DECLARED
          - NOT_AVAILABLE
          - SYSTEM_OBSERVED
          - REFERENCE_RPC
        evidenceRefs:
          type: array
          items:
            type: string
            pattern: ^[a-z][a-z0-9_:-]{2,127}$
          maxItems: 32
        checkedAt:
          type: string
          format: date-time
      required:
      - checkId
      - ruleId
      - required
      - status
      - reasonCode
      - expected
      - observed
      - sourceClass
      - evidenceRefs
      - checkedAt
      additionalProperties: false
    Fact:
      type: object
      properties:
        sourceChainId:
          const: '1'
        asset:
          const: ETH
        address:
          $ref: '#/components/schemas/Address'
        blockNumber:
          $ref: '#/components/schemas/Decimal'
        blockHash:
          $ref: '#/components/schemas/Digest'
        balanceWei:
          $ref: '#/components/schemas/Decimal'
        serviceId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
      required:
      - sourceChainId
      - asset
      - address
      - blockNumber
      - blockHash
      - balanceWei
      - serviceId
      additionalProperties: false
    InvocationObservation:
      type: object
      properties:
        bindingKind:
          type: string
          enum:
          - REQUEST_BOUND
          - PROVIDER_DECLARED
        requestHash:
          $ref: '#/components/schemas/Digest'
        requestedBlockHash:
          $ref: '#/components/schemas/Digest'
        providerDeclaredBlockHash:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        responseDigest:
          $ref: '#/components/schemas/Digest'
        parsedBalanceWei:
          anyOf:
          - $ref: '#/components/schemas/Decimal'
          - type: 'null'
      required:
      - bindingKind
      - requestHash
      - requestedBlockHash
      - providerDeclaredBlockHash
      - responseDigest
      - parsedBalanceWei
      additionalProperties: false
    Attempt:
      type: object
      properties:
        attemptId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
        serviceId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
        manifestHash:
          $ref: '#/components/schemas/Digest'
        status:
          $ref: '#/components/schemas/AttemptStatus'
        decision:
          type: string
          enum:
          - ALLOW
          - REJECT
          - QUARANTINE
        providerCallConsumed:
          type: boolean
        checks:
          type: array
          items:
            $ref: '#/components/schemas/RuleCheck'
          minItems: 1
        responseDigest:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        observation:
          anyOf:
          - $ref: '#/components/schemas/InvocationObservation'
          - type: 'null'
        startedAt:
          type: string
          format: date-time
        finishedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      required:
      - attemptId
      - serviceId
      - manifestHash
      - status
      - decision
      - providerCallConsumed
      - checks
      - responseDigest
      - observation
      - startedAt
      - finishedAt
      additionalProperties: false
    BudgetsUsed:
      type: object
      properties:
        candidateChecks:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        providerCalls:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        fallbacks:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        modelRounds:
          type: integer
          minimum: 0
          maximum: 9007199254740991
      required:
      - candidateChecks
      - providerCalls
      - fallbacks
      - modelRounds
      additionalProperties: false
    TaskView:
      type: object
      properties:
        taskId:
          type: string
          pattern: ^[a-z][a-z0-9_:-]{2,127}$
        revision:
          type: integer
          minimum: 1
        status:
          $ref: '#/components/schemas/TaskStatus'
        phase:
          $ref: '#/components/schemas/Phase'
        executionMode:
          $ref: '#/components/schemas/ExecutionMode'
        spec:
          anyOf:
          - $ref: '#/components/schemas/TaskSpec'
          - type: 'null'
        specHash:
          anyOf:
          - $ref: '#/components/schemas/Digest'
          - type: 'null'
        approvalNonce:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 512
          - type: 'null'
