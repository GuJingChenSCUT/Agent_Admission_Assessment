name: ci
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:demos
      - run: git diff --exit-code -- web/demo.html web/demo-film.html
      - run: pnpm test
      - run: pnpm run check
      - run: pnpm run compile:contract
